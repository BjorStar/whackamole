<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./styles/style.css" />
  <title>Whac-A-Mole</title>
  <style>
    .hidden { display: none; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Jolly+Lodger&display=swap" rel="stylesheet" />
  
</head>

<body>
  <h1>Whac-A-Mole</h1>

  <!-- Game Section -->
  <section id="game">
    <div class="game-info">
      <div>
        <div>Seconds left</div>
        <span id="countdown">10</span>
      </div>
      <div>
        <div>Hits</div>
        <span id="hits">0</span>
      </div>
      <div>
        <div>Misses</div>
        <span id="misses">0</span>
      </div>
      <div>
        <div>Score</div>
        <span id="score">0</span>
      </div>
    </div>

    <div id="game-board">
      <div class="holes"><img id="hole-1" src="./img/hole.png" alt="hole"></div>
      <div class="holes"><img id="hole-2" src="./img/hole.png" alt="hole"></div>
      <div class="holes"><img id="hole-3" src="./img/hole.png" alt="hole"></div>
      <div class="holes"><img id="hole-4" src="./img/hole.png" alt="hole"></div>
      <div class="holes"><img id="hole-5" src="./img/hole.png" alt="hole"></div>
      <div class="holes"><img id="hole-6" src="./img/hole.png" alt="hole"></div>
    </div>



<div class="player-entry">
  <label for="username">Enter your name:</label>
  <input type="text" id="username" placeholder="Your name" />
</div>

<button id="start-btn">Start Game</button>
<button id="stop-btn">Stop Game</button>

    <div class="leaderboard">
  <h2>High Scores</h2>
  <ol id="scoreList"></ol>
</div>

 
  </section>

  <!-- High Scores Section -->
  <section id="high-score" class="hidden">
    <h2>High Scores</h2>
    <ol id="scoreList"></ol>
    <button id="back-btn">Back to Game</button>
  </section>

  <script src="./src/game.js"></script>
</body>

</html>
