<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./styles/style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Jolly+Lodger&display=swap" rel="stylesheet">
        <title>Whac-A-Mole</title>
    </head>

    <body>

        <h1>Whac-A-Mole</h1>

        <!-- Menu -->
        <nav id="nav">
            <!-- menu goes here -->
        </nav>

        <!-- Player Profile -->
        <section id="profile" class="hidden">
            <h2>Player Profile</h2>
        </section>

        <!-- Game -->
        <section id="game">

            <div class="game-info">

                <div>
                    <div>Seconds left</div>
                    <span id="countdown">10</span>
                </div>

                <div>
                    <div>Hits</div>
                    <span id="hits">0</span>
                </div>

                <div>
                    <div>Misses</div>
                    <span id="misses">0</span>
                </div>

            </div>

            <div id="game-board">

                <div class="holes">
                    <img id="hole-1" src="./img/hole.png" alt="">
                </div>

                <div class="holes">
                    <img id="hole-2" src="./img/hole.png" alt="">
                </div>

                <div class="holes">
                    <img id="hole-3" src="./img/hole.png" alt="">
                </div>

                <div class="holes">
                    <img id="hole-4" src="./img/hole.png" alt="">
                </div>

                <div class="holes">
                    <img id="hole-5" src="./img/hole.png" alt="">
                </div>

                <div class="holes">
                    <img id="hole-6" src="./img/hole.png" alt="">
                </div>

            </div>

            <button id="start-btn">Start Game</button>

            <button id="stop-btn">STOP</button>

        </section>

        <!-- High Scores -->
        <section id="high-score" class="hidden">
            <h2>High Scores</h2>
            <!-- list of high scores goes here -->

        </section>

        <script src="./src/game.js"></script>

    </body>

</html>
